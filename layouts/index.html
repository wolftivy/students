{{ define "main" }}

    <!-- HERO / BRAND -->
    <section class="hero">
        <div class="emblem-badge">
            <img src="/owl-emblem.png" alt="The Students" class="hero-emblem">
        </div>
        <h1 class="hero-title">The Students</h1>
        <div class="hero-line"></div>
        <p class="hero-subtitle">{{ .Site.Params.motto }}</p>
    </section>

    <!-- RECENT CONTENT -->
    <div class="content-zone">
        <section class="feed-section">
            {{ $items := where .Site.RegularPages "Type" "in" (slice "videos" "posts") }}
            {{ partial "content-grid.html" $items.ByDate.Reverse }}
        </section>
    </div>

{{ end }}
