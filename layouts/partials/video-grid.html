{{ $videos := . }}
{{ if $videos }}
<div class="video-grid">
    {{ range $videos }}
    <a href="{{ .RelPermalink }}" class="video-card">
        <div class="video-thumb">
            <img src="https://img.youtube.com/vi/{{ .Params.youtube_id }}/hqdefault.jpg" alt="" loading="lazy">
            <div class="play-icon"></div>
        </div>
        <div class="video-title">{{ .Title }}</div>
        <div class="video-meta">{{ .Date.Format "January 2006" }}</div>
    </a>
    {{ end }}
</div>
{{ else }}
<p class="empty-state">No videos yet.</p>
{{ end }}
